warning_threshold: 1

excluded:
  - build_sim
  - build
  - build_archive
  - DerivedData
  - "**/build/**"
  - "**/.build/**"
  - "**/.swiftpm/**"

disabled_rules:
  - line_length
  - todo
  - multiple_closures_with_trailing_closure
  - redundant_string_enum_value

opt_in_rules:
  - opening_brace
  - pattern_matching_keywords
  - force_unwrapping
  - fatal_error_message
  - discouraged_assert
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - fallthrough
  - identical_operands
  - return_value_from_void_function
  - unowned_variable_capture
  - untyped_error_in_catch
  - async_without_await
  - unhandled_throwing_task
  - redundant_sendable
  - empty_count
  - empty_collection_literal
  - empty_string
  - first_where
  - last_where
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - flatmap_over_map_reduce
  - reduce_into
  - sorted_first_last
  - array_init
  - prefer_zero_over_explicit_init
  - shorthand_optional_binding
  - self_binding
  - redundant_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - toggle_bool
  - convenience_type
  - direct_return
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_type_checking
  - superfluous_else
  - yoda_condition
  - implicit_return
  - optional_enum_case_matching
  - private_swiftui_state
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - prefer_asset_symbols
  - modifier_order
  - legacy_swiftui_aspect_ratio
  - raw_value_for_camel_cased_codable_enum
  - balanced_xctest_lifecycle
  - empty_xctest_method
  - final_test_case
  - single_test_class
  - test_case_accessibility
  - xct_specific_matcher
  - trailing_closure
  - closure_spacing
  - closure_end_indentation
  - collection_alignment
  - comma_inheritance
  - literal_expression_end_indentation
  - operator_usage_whitespace
  - period_spacing
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - vertical_whitespace_between_cases
  - unneeded_parentheses_in_closure_argument
  - number_separator
  - discarded_notification_center_observer
  - overridden_super_call
  - prohibited_super_call
  - weak_delegate
  - non_overridable_class_declaration
  - lower_acl_than_parent
  - no_extension_access_modifier
  - strict_fileprivate
  - closure_body_length
  - anonymous_argument_in_multiline_closure
  - unneeded_escaping
  - unneeded_throws_rethrows
  - discouraged_none_name
  - expiring_todo
  - legacy_multiple
  - no_empty_block
  - prefer_condition_list
  - variable_shadowing
  - unused_parameter
  - local_doc_comment

analyzer_rules:
  - capture_variable
  - explicit_self
  - typesafe_array_init
  - unused_declaration
  - unused_import

file_length:
  warning: 200
  error: 200
  ignore_comment_only_lines: true

opening_brace:
  ignore_multiline_statement_conditions: true
  ignore_multiline_function_signatures: true

type_name:
  min_length:
    warning: 2
    error: 2
  max_length:
    warning: 40
    error: 60

closure_body_length:
  warning: 100
  error: 150

function_body_length:
  warning: 100
  error: 150

type_body_length:
  warning: 200
  error: 200

function_parameter_count:
  warning: 8
  error: 10

force_cast:
  severity: error

force_try:
  severity: error

force_unwrapping:
  severity: warning

identifier_name:
  min_length:
    warning: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    - R
    - OutRank
    - NewRank
    - S0
    - K
    - B
    - N
    - Uniform
    - Pert
    - Normal
    - Triangular
    - t3D_A
    - s1_5
    - a1
    - a2
    - q1
    - q2
    - d0
    - d1
    - d2
    - d3
    - d4

nesting:
  type_level:
    warning: 3
    error: 4
  function_level:
    warning: 4
    error: 6

cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true

large_tuple:
  warning: 3
  error: 4

number_separator:
  minimum_length: 5

modifier_order:
  preferred_modifier_order:
    - acl
    - setterACL
    - override
    - isolation
    - dynamic
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

vertical_whitespace:
  max_empty_lines: 1
